name: ci

on:
  push:
  pull_request:

# nothing in here needs to write to the repo
permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # a newer push makes an older run on the same branch pointless
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # types, lint and tests. the tests build public/ first
      - run: npm run check

  deploy:
    name: deploy
    # only main, only after the checks. the cloudflare secrets are plain repository secrets,
    # which a pull request from a fork never gets. (environment secrets stop working on a free private repo)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # wrangler uploads the folder and nothing else, so the source never leaves github
      - run: npx wrangler pages deploy public --project-name mirai-ext --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      # a bad deploy should be a red run, not a broken extension on somebody's phone
      - run: npm run verify-live
